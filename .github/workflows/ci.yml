name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: learning_platform
          POSTGRES_PASSWORD: learning_platform
          POSTGRES_DB: learning_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U learning_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Clean DB for the migration check; a separate DB for pytest.
      DATABASE_URL: postgresql+psycopg://learning_platform:learning_platform@localhost:5432/learning_platform
      TEST_DATABASE_URL: postgresql+psycopg://learning_platform:learning_platform@localhost:5432/learning_platform_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy app

      - name: Question bank quality (strict)
        run: python -m app.seeds.questions.validate --strict

      - name: Alembic upgrade on a clean database
        run: alembic upgrade head

      - name: Alembic downgrade to base
        run: alembic downgrade base

      - name: Alembic upgrade again after downgrade
        run: alembic upgrade head

      - name: Create test database
        run: PGPASSWORD=learning_platform psql -h localhost -U learning_platform -d learning_platform -c "CREATE DATABASE learning_platform_test"

      - name: Pytest
        run: pytest --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
